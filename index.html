<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Campus UNAL · Sede Bogotá</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;padding:0}
  body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;background:#e5e3df;color:#202124;--controls-offset:0px}
  #map{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:0;background:#e5e3df}

  /* ── Barra superior y buscador ── */
  #topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1100;pointer-events:none}
  @media (min-width:768px){#topbar{right:auto;width:400px}}
  .search-wrap{position:relative;pointer-events:auto;z-index:20}
  #search-form{display:flex;align-items:center;height:48px;background:#fff;border-radius:9999px;box-shadow:0 2px 10px rgba(0,0,0,.22);padding:0 14px;gap:10px}
  #search-form svg{width:20px;height:20px;color:#5f6368;flex:none}
  #search-input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;color:#202124}
  #search-clear{flex:none;width:32px;height:32px;margin-right:-4px;border:0;border-radius:9999px;background:transparent;color:#5f6368;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #results{position:absolute;left:0;right:0;top:56px;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.22);overflow-y:auto;max-height:60vh;padding:6px 0}
  .result{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;background:transparent;border:0;cursor:pointer}
  .result:hover{background:#f1f3f4}
  .result .ic{flex:none;width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
  .result .ic svg{width:18px;height:18px}
  .result-info{min-width:0;flex:1}
  .result-title{display:block;font-size:14px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result-sub{display:block;font-size:12px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-top:8px;scrollbar-width:none;pointer-events:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9999px;background:#fff;color:#3c4043;font-size:13px;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.25);border:1px solid transparent;cursor:pointer}
  .chip svg{width:15px;height:15px}
  .chip[aria-pressed="true"]{background:#e8f0fe;color:#1967d2;border-color:#d2e3fc}

  /* ── HUD de navegación en vivo (estilo Waze / Google Maps) ── */
  #nav-hud{position:fixed;top:12px;left:12px;right:12px;z-index:1150;background:#0f533a;color:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.35);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  @media (min-width:768px){#nav-hud{left:50%;right:auto;transform:translateX(-50%);width:460px}}
  .nav-hud-top{display:flex;align-items:center;gap:12px}
  .nav-hud-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
  .nav-hud-ic svg{width:24px;height:24px}
  .nav-hud-step{font-size:16px;font-weight:700;line-height:1.25}
  .nav-hud-dest{font-size:12px;opacity:.88;margin-top:2px}
  .nav-hud-bot{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,.22);padding:8px 12px;border-radius:10px;gap:8px}
  .nav-hud-stats{font-size:14px;font-weight:700}
  .nav-hud-stats span{font-weight:400;opacity:.9;font-size:13px}
  .nav-hud-btns{display:flex;gap:8px}
  .btn-hud{border:0;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .btn-hud-sim{background:rgba(255,255,255,.2);color:#fff}
  .btn-hud-stop{background:#dc2626;color:#fff}

  /* ── Controles flotantes ── */
  .leaflet-bottom.leaflet-right{bottom:var(--controls-offset);transition:bottom .3s ease}
  .leaflet-touch .leaflet-bar{border:0;box-shadow:0 2px 8px rgba(0,0,0,.28);border-radius:12px;overflow:hidden}
  .leaflet-touch .leaflet-bar a{width:42px;height:42px;line-height:42px;font-size:20px;color:#3c4043}
  @media (max-width:767px){body.sheet-open .leaflet-control-zoom,body.sheet-open #btn-sim{display:none}}
  .fab-stack{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .fab{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#3c4043;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.28)}
  .fab svg{width:19px;height:19px;flex:none}
  .fab-round{width:42px;height:42px;border-radius:12px}
  .fab-round.active{color:#1a73e8}
  .fab-pill{height:36px;padding:0 14px;border-radius:9999px;font-size:12px;font-weight:600;color:#1967d2}
  .fab-pill svg{width:15px;height:15px}

  /* ── Marcadores ── */
  .pin-wrap{background:none;border:0}
  .pin{position:relative;width:32px;height:40px;cursor:pointer}
  .pin-head{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .15s}
  .pin-head svg{width:15px;height:15px}
  .pin::before{content:"";position:absolute;left:8px;top:28px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #fff}
  .pin::after{content:"";position:absolute;left:10px;top:29px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--c)}
  .pin-wrap.selected .pin-head{transform:scale(1.2);box-shadow:0 0 0 4px rgba(26,115,232,.35),0 3px 8px rgba(0,0,0,.4)}
  .pin-label{display:none;position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;color:#202124;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
  .show-labels .pin-label{display:block}

  .me-wrap{background:none;border:0}
  .me{position:relative;width:24px;height:24px}
  .me-core{position:absolute;left:4px;top:4px;width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
  .me-pulse{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:rgba(26,115,232,.45);animation:me-pulse 2s ease-out infinite}
  @keyframes me-pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}

  .route-badge{background:none;border:0}
  .route-badge-inner{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#1a73e8;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9999px;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
  .route-badge-inner svg{width:14px;height:14px}

  /* ── Panel lateral / Bottom Sheet ── */
  #panel{position:fixed;z-index:1050;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.28);overflow-x:hidden;overflow-y:auto;visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
  #panel.open{visibility:visible;transform:none;transition:transform .3s ease,visibility 0s}
  @media (min-width:768px){
    #panel{left:12px;top:116px;width:400px;max-height:calc(100vh - 128px);border-radius:16px;transform:translateX(-440px)}
    .sheet-handle{display:none}
  }
  @media (max-width:767px){
    #panel{left:0;right:0;bottom:0;max-height:68vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
    .sheet-handle{display:block;position:absolute;top:7px;left:50%;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.85);transform:translateX(-50%);z-index:5}
  }

  /* Foto de portada del lugar */
  .place-cover{position:relative;width:100%;height:145px;background:#1e293b;overflow:hidden}
  .place-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .place-cover-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,.15))}
  .place-cover-tag{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:4px 9px;border-radius:6px;backdrop-filter:blur(4px)}
  .place-cover-gmaps{position:absolute;right:12px;bottom:10px;background:#fff;color:#1a73e8;font-size:11px;font-weight:700;padding:5px 10px;border-radius:9999px;text-decoration:none;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .place-cover-gmaps svg{width:13px;height:13px}

  .panel-head{position:relative;color:#fff;padding:14px 16px;background:var(--c)}
  .panel-head-row{display:flex;align-items:center;gap:12px;padding-right:36px}
  .panel-head .ic{flex:none;width:42px;height:42px;border-radius:9999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
  .panel-head .ic svg{width:20px;height:20px}
  .panel-title{margin:0;font-size:18px;font-weight:700;line-height:1.25}
  .panel-sub{margin:2px 0 0;font-size:12px;opacity:.92}
  .icon-btn{position:absolute;top:10px;right:10px;z-index:6;width:34px;height:34px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;border:0;cursor:pointer}
  .icon-btn svg{width:18px;height:18px}

  .panel-sec{padding:14px 16px;border-bottom:1px solid #e8eaed}
  .route-box{display:flex;gap:12px}
  .route-dots{display:flex;flex-direction:column;align-items:center;padding:12px 0}
  .dot-origin{width:12px;height:12px;border-radius:9999px;border:3px solid #1a73e8;background:#fff}
  .dot-line{flex:1;border-left:2px dotted #bdc1c6;margin:4px 0}
  .route-dots svg{width:16px;height:16px;color:#d93025}
  .route-inputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .dest-box{height:38px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#f1f3f4;font-size:14px;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .select{width:100%;height:38px;border:1px solid #dadce0;border-radius:10px;padding:0 10px;background:#fff;font-size:14px;color:#202124}
  .hint{font-size:12px;color:#5f6368;margin:8px 0 0}

  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin-top:12px;border-radius:9999px;background:#1a73e8;color:#fff;font-weight:600;font-size:14px;border:0;cursor:pointer}
  .btn-primary svg,.btn-live svg,.btn-ext svg{width:16px;height:16px}
  .btn-live{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;margin-top:8px;border-radius:9999px;background:#137333;color:#fff;font-weight:700;font-size:13px;border:0;cursor:pointer}
  .ext-apps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .btn-ext{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:10px;background:#f1f3f4;color:#202124;font-size:12px;font-weight:600;text-decoration:none;border:1px solid #dadce0}
  .btn-ext:hover{background:#e8eaed}

  .btn-link{color:#1a73e8;font-weight:600;font-size:13px;background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
  .route-card{margin-top:12px;border-radius:12px;background:#e8f0fe;padding:12px}
  .route-card-top{display:flex;align-items:center;gap:12px}
  .route-card-ic{flex:none;width:38px;height:38px;border-radius:9999px;background:#fff;color:#1a73e8;display:flex;align-items:center;justify-content:center}
  .route-card-ic svg{width:19px;height:19px}
  .route-card-main{flex:1;min-width:0}
  .route-card-time{font-size:17px;font-weight:700;color:#202124}
  .route-card-time span{font-size:13px;font-weight:400;color:#5f6368}
  .route-card-sub{font-size:11px;color:#5f6368;margin-top:2px}

  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;font-size:12px;font-weight:600}
  .badge svg{width:14px;height:14px;flex:none}
  .badge-blue{background:#e8f0fe;color:#1967d2}
  .badge-green{background:#e6f4ea;color:#137333}
  .badge-amber{background:#fef7e0;color:#b06000}
  .info-list{padding:6px 0}
  .info-row{display:flex;gap:14px;padding:10px 16px;align-items:flex-start;font-size:14px;line-height:1.4;color:#3c4043}
  .info-row svg{width:19px;height:19px;color:#1a73e8;flex:none;margin-top:2px}
  .banner-note{margin:4px 16px 12px;display:flex;gap:10px;border-radius:12px;background:#fef7e0;padding:12px;font-size:13px;color:#7a4100;line-height:1.4}
  .banner-note svg{width:18px;height:18px;flex:none;margin-top:1px}
  .panel-foot{padding:4px 16px 16px;font-size:11px;color:#80868b;margin:0}
  #toast{position:fixed;left:50%;top:112px;z-index:1250;max-width:min(90vw,420px);transform:translate(-50%,-16px);opacity:0;pointer-events:none;background:#202124;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .25s,transform .25s;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="map"></div>

<!-- HUD de navegación en vivo (Waze / Maps) -->
<div id="nav-hud" hidden>
  <div class="nav-hud-top">
    <div class="nav-hud-ic" id="hud-icon"></div>
    <div style="min-width:0;flex:1">
      <div class="nav-hud-step" id="hud-step">Sigue el sendero marcado</div>
      <div class="nav-hud-dest" id="hud-dest">Destino</div>
    </div>
  </div>
  <div class="nav-hud-bot">
    <div class="nav-hud-stats" id="hud-stats">0 min <span>· 0 m</span></div>
    <div class="nav-hud-btns">
      <button type="button" class="btn-hud btn-hud-sim" id="btn-sim-walk">Simular caminata</button>
      <button type="button" class="btn-hud btn-hud-stop" id="btn-stop-nav">Finalizar</button>
    </div>
  </div>
</div>

<div id="topbar">
  <div class="search-wrap">
    <form id="search-form" role="search" autocomplete="off">
      <img src="logo.png" alt="Logo" onerror="this.style.display='none'" style="height:28px;width:auto;border-radius:6px;flex:none;">
      <span id="ic-search"></span>
      <input id="search-input" type="text" placeholder="Busca edificios, comida, porterías…" aria-label="Buscar lugares">
      <button type="button" id="search-clear" hidden aria-label="Borrar búsqueda"></button>
    </form>
    <div id="results" hidden role="listbox"></div>
  </div>
  <div id="chips" role="group"></div>
</div>

<aside id="panel" aria-hidden="true"><div id="panel-body"></div></aside>
<div id="toast" role="status"></div>

<script>
function startApp() {
  const ICONS = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>',
    utensils: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>',
    coffee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1M6 2v2M10 2v2M14 2v2"/></svg>',
    door: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M13 4h3a2 2 0 0 1 2 2v14M2 20h3M13 20h9M10 12v.01M13 4.562v16.157a1 1 0 0 1-1.242.97L5 20V5.562a2 2 0 0 1 1.515-1.94l4-1A2 2 0 0 1 13 4.561Z"/></svg>',
    bus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>',
    locate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    nav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
    walk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="13" cy="4" r="2"/><path d="m10 21 2-6 3 3v3M7 14l3-4 4 1 3 3"/></svg>',
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>',
    access: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1M5 8l3-3 5.5 3-2.36 3.5M4.24 14.5a5 5 0 0 0 6.88 6M13.76 17.5a5 5 0 0 0-6.88-6"/></svg>',
    money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>'
  };
  const svg = n => ICONS[n] || '';

  const CENTER = [4.6355, -74.0835];
  const PLAZA_CHE = { lat: 4.634903, lng: -74.081902 };
  const WALK_KMH = 5;
  const LABEL_ZOOM = 17;
  const PRICE_REST = '$15.000 - $30.000 COP';

  const CATS = {
    edificio:     { label: 'Edificio académico',    color: '#2563eb', icon: 'building' },
    restaurante:  { label: 'Restaurante',           color: '#ea580c', icon: 'utensils' },
    chaza:        { label: 'Chazas',                color: '#ca8a04', icon: 'coffee'   },
    porteria:     { label: 'Portería',              color: '#059669', icon: 'door'     },
    transmilenio: { label: 'Estación TransMilenio', color: '#dc2626', icon: 'bus'      }
  };

  const GROUP_TERMS = {
    edificio: 'edificios', restaurante: 'comida restaurantes', chaza: 'comida chazas',

  const $ = (s, r = document) => r.querySelector(s);

  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;

  const walkMinutes = m => Math.max(1, Math.round(m / (WALK_KMH * 1000 / 60)));
  const fmtTime = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${min % 60} min`;
  const subtitle = p => [p.code, CATS[p.type].label].filter(Boolean).join(' · ');

  // Enlaces oficiales a Google Maps y Waze
  const gmapsPlaceUrl = p => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;

  // Vista satelital exacta como portada si no hay foto manual
  function satTileUrl(lat, lng, z = 18) {
    const n = Math.pow(2, z);
    const x = Math.floor((lng + 180) / 360 * n);
    const rad = lat * Math.PI / 180;
    const y = Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n);
    return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
  }

  const byId = Object.fromEntries(PLACES.map(p => [p.id, p]));
  PLACES.forEach(p => { p._hay = norm([p.name, p.code, CATS[p.type].label, GROUP_TERMS[p.type], (p.keywords || []).join(' ')].join(' ')); });
  const ORIGIN_PLACES = PLACES.filter(p => p.type === 'porteria' || p.type === 'transmilenio');

  const state = {

  };

  const panel = $('#panel'), panelBody = $('#panel-body'), input = $('#search-input'), clearBtn = $('#search-clear'), resultsEl = $('#results'), chipsEl = $('#chips');

  const map = L.map('map', { zoomControl: false, center: CENTER, zoom: window.innerWidth >= 1000 ? 16 : 15, minZoom: 13, maxZoom: 19 });

  const primaryTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: '&copy; Esri &copy; OpenStreetMap'
  }).addTo(map);

  let fallbackLoaded = false;
  primaryTiles.on('tileerror', () => {
    if (fallbackLoaded) return;
    fallbackLoaded = true;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  });

  L.control.zoom({ position: 'bottomright', zoomInTitle: 'Acercar', zoomOutTitle: 'Alejar' }).addTo(map);

  const Fabs = L.Control.extend({

  const markersLayer = L.layerGroup().addTo(map);

  const markers = {};

      html: `<div class="pin" style="--c:${c.color}"><div class="pin-head">${svg(c.icon)}</div><span class="pin-label">${esc(p.short)}</span></div>`,

    const m = L.marker([p.lat, p.lng], { icon, title: p.name, riseOnHover: true });
    m.on('click', () => { if (!state.navActive) selectPlace(p.id); });
    markers[p.id] = m;
  });

  function matches(p) {
    const f = FILTERS.find(x => x.key === state.filter) || FILTERS[0];
    if (!f.match(p)) return false;
    const tokens = norm(state.query).split(/\s+/).filter(Boolean);
    return tokens.every(t => p._hay.includes(t));
  }

  function syncSelected() {
    PLACES.forEach(p => {
      const m = markers[p.id], el = m.getElement();
      if (el) el.classList.toggle('selected', p.id === state.selectedId);
      m.setZIndexOffset(p.id === state.selectedId ? 1000 : 0);
    });
  }

  function renderMarkers() {
    PLACES.forEach(p => {
      const show = matches(p) || p.id === state.selectedId, m = markers[p.id], has = markersLayer.hasLayer(m);
      if (show && !has) markersLayer.addLayer(m);
      if (!show && has) markersLayer.removeLayer(m);
    });
    syncSelected();
  }

  function syncLabels() { map.getContainer().classList.toggle('show-labels', map.getZoom() >= LABEL_ZOOM); }

  function panelHeight() { return panel.classList.contains('open') ? Math.min(panel.offsetHeight, window.innerHeight * 0.68) : 0; }

    const target = panel.classList.contains('open') ? (isDesktop() ? pt.subtract([200, 0]) : pt.add([0, Math.max(0, panelHeight() - 112) / 2])) : pt;
    map.flyTo(map.unproject(target, z), z, { duration: 0.7 });
  }
  function fitPoints(points, maxZoom = 18) {
    if (!points.length) return;

  function renderChips() {

  function updateOriginHint() {
    const el = $('#origin-hint'); if (!el) return;
    if (state.originKey === 'me' && !state.me) { el.hidden = false; el.innerHTML = 'Activa tu GPS al pulsar «Cómo llegar», o <button type="button" class="btn-link" data-action="simulate">simula estar en Plaza Che</button>.'; }
    else if (state.originKey === 'me' && state.simulated) { el.hidden = false; el.textContent = 'Usando ubicación simulada en Plaza Che.'; }
    else el.hidden = true;
  }

  /* ═════════════ Enrutamiento peatonal real (OSRM + respaldo) ═════════════ */
  function originLatLng(key) { return key === 'me' ? (state.me ? [state.me.lat, state.me.lng] : null) : (byId[key] ? [byId[key].lat, byId[key].lng] : null); }

  async function fetchWalkingRoute(o, d) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4500);
    try {
      const url = `https://router.project-osrm.org/route/v1/foot/${o[1]},${o[0]};${d[1]},${d[0]}?overview=full&geometries=geojson&steps=true`;
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('OSRM error');
      const data = await res.json();
      if (!data.routes || !data.routes.length) throw new Error('No route');
      const r = data.routes[0];
      const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      const steps = (r.legs[0]?.steps || []).map(s => formatStep(s));
      return { coords, dist: r.distance, mins: Math.max(1, Math.round(r.distance / (WALK_KMH * 1000 / 60))), steps, isPath: true };
    } catch (_) {
      clearTimeout(timer);
      const dist = map.distance(o, d);
      return { coords: [o, d], dist, mins: walkMinutes(dist), steps: ['Dirígete hacia el destino marcado'], isPath: false };
    }
  }

  function formatStep(s) {
    const t = s.maneuver?.type || '';
    const m = s.maneuver?.modifier || '';
    if (t === 'arrive') return 'Has llegado a tu destino';
    if (t === 'depart') return 'Inicia el recorrido por el sendero';
    if (m.includes('left')) return 'Gira a la izquierda';
    if (m.includes('right')) return 'Gira a la derecha';
    return 'Continúa recto por el sendero';
  }

  function requestRoute() {
    const dest = byId[state.selectedId]; if (!dest) return;
    if (state.originKey === 'me' && !state.me) { state.pendingRoute = true; toast('Buscando tu ubicación GPS…', 2500); startLocate({ recenter: false }); return; }
    traceRoute({ fit: true });
  }

  async function traceRoute({ fit = true } = {}) {
    const dest = byId[state.selectedId], o = originLatLng(state.originKey); if (!dest || !o) return;
    const d = [dest.lat, dest.lng];
    const directDist = map.distance(o, d);
    if (directDist < 12) {
      if (state.navActive) { toast(`¡Has llegado a ${dest.name}!`, 5000); stopLiveNav(); }
      else toast('Ya estás en el destino.');
      routeLayer.clearLayers(); state.route = null; showRouteResult(); return;
    }

    const r = await fetchWalkingRoute(o, d);
    routeLayer.clearLayers();

    L.polyline(r.coords, { color: '#ffffff', weight: 10, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(routeLayer);
    L.polyline(r.coords, { color: '#1a73e8', weight: 6, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(routeLayer);
    L.circleMarker(o, { radius: 7, color: '#1a73e8', weight: 3, fillColor: '#ffffff', fillOpacity: 1, interactive: false }).addTo(routeLayer);

    const mid = r.coords[Math.floor(r.coords.length / 2)];
    L.marker(mid, {
      icon: L.divIcon({ className: 'route-badge', html: `<div class="route-badge-inner">${svg('walk')}${fmtTime(r.mins)} · ${fmtDist(r.dist)}</div>`, iconSize: [0, 0], iconAnchor: [0, 0] }),
      interactive: false, zIndexOffset: 500
    }).addTo(routeLayer);

    state.route = r;
    showRouteResult();
    updateNavHud();
    if (fit && !state.navActive) fitPoints(r.coords);
  }

  function showRouteResult() {
    const el = $('#route-result'); if (!el) return;
    if (!state.route) { el.innerHTML = ''; return; }
    const kind = state.route.isPath ? 'Por senderos peatonales' : 'Distancia aproximada';
    el.innerHTML = `<div class="route-card">
      <div class="route-card-top">
        <span class="route-card-ic">${svg('walk')}</span>
        <div class="route-card-main">
          <div class="route-card-time">${fmtTime(state.route.mins)} <span>· ${fmtDist(state.route.dist)}</span></div>
          <div class="route-card-sub">${kind} · a ${WALK_KMH} km/h</div>
        </div>
        <button type="button" class="btn-link" data-action="clear-route">Quitar</button>
      </div>
      <button type="button" class="btn-live" data-action="start-nav">${svg('nav')}Iniciar navegación en vivo</button>
    </div>`;
  }

  function clearRoute() { routeLayer.clearLayers(); state.route = null; state.pendingRoute = false; showRouteResult(); }

  /* ═════════════ Modo navegación en vivo (tipo Waze) ═════════════ */
  function startLiveNav() {
    const dest = byId[state.selectedId];
    if (!dest || !state.route) return;
    state.navActive = true;
    state.originKey = 'me';
    $('#topbar').hidden = true;
    $('#nav-hud').hidden = false;
    panel.classList.remove('open');
    updateOffsets();
    updateNavHud();

    if (!state.me) {
      simulateLocation();
    } else {
      map.flyTo([state.me.lat, state.me.lng], 18, { duration: 0.6 });
    }
    if (!state.simulated && state.watchId === null) startLocate({ recenter: true });
    toast('Navegación en vivo activada', 2500);
  }

  function stopLiveNav() {
    state.navActive = false;
    if (state.simWalkTimer) { clearInterval(state.simWalkTimer); state.simWalkTimer = null; }
    $('#nav-hud').hidden = true;
    $('#topbar').hidden = false;
    if (state.selectedId && byId[state.selectedId]) openPanel();
  }

  function updateNavHud() {
    if (!state.navActive || !state.route) return;
    const dest = byId[state.selectedId];
    $('#hud-step').textContent = state.route.steps[0] || 'Sigue el sendero marcado';
    $('#hud-dest').textContent = `Hacia ${dest ? dest.name : 'destino'}`;
    $('#hud-stats').innerHTML = `${fmtTime(state.route.mins)} <span>· ${fmtDist(state.route.dist)} restantes</span>`;
  }

  $('#btn-stop-nav').addEventListener('click', stopLiveNav);

  // Simulador de caminata paso a paso para probar el modo Waze en vivo
  $('#btn-sim-walk').addEventListener('click', () => {
    if (state.simWalkTimer) {
      clearInterval(state.simWalkTimer); state.simWalkTimer = null;
      $('#btn-sim-walk').textContent = 'Simular caminata';
      return;
    }
    if (!state.route || state.route.coords.length < 2) return;
    stopWatch();
    state.simulated = true;
    $('#btn-sim-walk').textContent = 'Pausar simulación';
    const path = [...state.route.coords];
    let idx = 0;
    state.simWalkTimer = setInterval(() => {
      idx++;
      if (idx >= path.length) {
        clearInterval(state.simWalkTimer); state.simWalkTimer = null;
        $('#btn-sim-walk').textContent = 'Simular caminata';
        const dest = byId[state.selectedId];
        toast(`¡Has llegado a ${dest ? dest.name : 'tu destino'}!`, 4500);
        stopLiveNav();
        return;
      }
      setMe({ lat: path[idx][0], lng: path[idx][1] });
      map.panTo([path[idx][0], path[idx][1]], { animate: true, duration: 0.8 });
    }, 1200);
  });

  /* ═════════════ Geolocalización ═════════════ */
  let meMarker = null;
  function setMe(ll) {
    state.me = { lat: ll.lat, lng: ll.lng };
    if (!meMarker) {
      meMarker = L.marker([ll.lat, ll.lng], {
        icon: L.divIcon({ className: 'me-wrap', html: '<div class="me"><span class="me-pulse"></span><span class="me-core"></span></div>', iconSize: [24, 24], iconAnchor: [12, 12] }),
        interactive: false, zIndexOffset: 2000
      }).addTo(meLayer);
    } else meMarker.setLatLng([ll.lat, ll.lng]);
    const opt = $('#origin-select option[value="me"]'); if (opt) opt.textContent = meLabel();
    updateOriginHint();
    const b = $('#btn-locate'); if (b) b.classList.toggle('active', !!state.me && !state.simulated);
    if (state.route && state.originKey === 'me') traceRoute({ fit: false });
  }
  function stopWatch() { if (state.watchId !== null && 'geolocation' in navigator) navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
  function startLocate({ recenter = true } = {}) {
    if (!('geolocation' in navigator)) { state.pendingRoute = false; toast('Tu navegador no soporta GPS. Usa «Simular en Plaza Che».'); return; }
    state.simulated = false;
    if (state.watchId !== null) { if (state.me && recenter) focusOn(state.me, 18); return; }
    let first = true;
    state.watchId = navigator.geolocation.watchPosition(pos => {
      setMe({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      if (state.navActive) map.panTo([pos.coords.latitude, pos.coords.longitude]);
      if (first) { first = false; if (state.pendingRoute) { state.pendingRoute = false; traceRoute({ fit: true }); } else if (recenter) focusOn(state.me, 17); }
    }, () => { stopWatch(); state.pendingRoute = false; toast('No se obtuvo GPS. Prueba «Simular en Plaza Che».', 4500); updateOriginHint(); }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 });
  }
  function simulateLocation() {
    stopWatch(); state.simulated = true; setMe(PLAZA_CHE); toast('Ubicación simulada en Plaza Che.');
    if (state.pendingRoute) { state.pendingRoute = false; traceRoute({ fit: true }); } else focusOn(PLAZA_CHE, 18);
  }
  $('#btn-locate').addEventListener('click', () => { if (state.me && state.watchId !== null) { focusOn(state.me, 18); return; } toast('Buscando tu ubicación…', 2500); startLocate({ recenter: true }); });
  $('#btn-sim').addEventListener('click', simulateLocation);

  let toastTimer;
  function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }

  /* ═════════════ Modo calibración oculto (?editar=1) ═════════════ */
  if (location.search.includes('editar=1')) {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;bottom:16px;left:16px;z-index:2000;background:#202124;color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.4);';
    box.innerHTML = '<b>Modo calibración</b><br>Arrastra cada pin a su lugar exacto.<br><button id="copy-coords" style="margin-top:8px;background:#1a73e8;color:#fff;border:0;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;">Copiar coordenadas nuevas</button>';
    document.body.appendChild(box);
    PLACES.forEach(p => {
      markers[p.id].options.draggable = true;
      if (markers[p.id].dragging) markers[p.id].dragging.enable();
      markers[p.id].on('dragend', e => {
        const ll = e.target.getLatLng();
        p.lat = Number(ll.lat.toFixed(6)); p.lng = Number(ll.lng.toFixed(6));
        toast(`${p.short}: ${p.lat}, ${p.lng}`);
      });
    });
    document.getElementById('copy-coords').onclick = () => {
      const txt = PLACES.map(p => `${p.name} (${p.id}):\n  lat: ${p.lat}, lng: ${p.lng}`).join('\n\n');
      navigator.clipboard.writeText(txt);
      toast('¡Coordenadas copiadas al portapapeles!');
    };
  }

  renderChips(); renderMarkers(); renderResults(); syncLabels(); updateOffsets();
}

(function loadLeaflet(urls) {
  if (typeof L !== 'undefined') { startApp(); return; }
  if (!urls.length) {
    document.getElementById('map').innerHTML = '<div style="padding:120px 20px;text-align:center;color:#b91c1c;">No se pudo descargar Leaflet. Revisa tu conexión a internet.</div>';
    return;
  }
  var s = document.createElement('script');
  s.src = urls[0];
  s.onload = function() { startApp(); };
  s.onerror = function() { loadLeaflet(urls.slice(1)); };
  document.body.appendChild(s);
})([
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
]);
</script>
</body>
</html>
