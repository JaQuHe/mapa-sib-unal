<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Campus UNAL · Sede Bogotá</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;padding:0}
  body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;background:#e5e3df;color:#202124;--controls-offset:0px}
  #map{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:0;background:#e5e3df}

  #topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1100;pointer-events:none}
  @media (min-width:768px){#topbar{right:auto;width:400px}}
  .search-wrap{position:relative;pointer-events:auto;z-index:20}
  #search-form{display:flex;align-items:center;height:48px;background:#fff;border-radius:9999px;box-shadow:0 2px 10px rgba(0,0,0,.22);padding:0 16px;gap:12px}
  #search-form svg{width:20px;height:20px;color:#5f6368;flex:none}
  #search-input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;color:#202124}
  #search-clear{flex:none;width:32px;height:32px;margin-right:-6px;border:0;border-radius:9999px;background:transparent;color:#5f6368;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #results{position:absolute;left:0;right:0;top:56px;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.22);overflow-y:auto;max-height:60vh;padding:6px 0}
  .result{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;background:transparent;border:0;cursor:pointer}
  .result:hover{background:#f1f3f4}
  .result .ic{flex:none;width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
  .result .ic svg{width:18px;height:18px}
  .result-info{min-width:0;flex:1}
  .result-title{display:block;font-size:14px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result-sub{display:block;font-size:12px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-top:8px;scrollbar-width:none;pointer-events:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9999px;background:#fff;color:#3c4043;font-size:13px;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.25);border:1px solid transparent;cursor:pointer}
  .chip svg{width:15px;height:15px}
  .chip[aria-pressed="true"]{background:#e8f0fe;color:#1967d2;border-color:#d2e3fc}

  .leaflet-bottom.leaflet-right{bottom:var(--controls-offset);transition:bottom .3s ease}
  .leaflet-touch .leaflet-bar{border:0;box-shadow:0 2px 8px rgba(0,0,0,.28);border-radius:12px;overflow:hidden}
  .leaflet-touch .leaflet-bar a{width:42px;height:42px;line-height:42px;font-size:20px;color:#3c4043}
  @media (max-width:767px){body.sheet-open .leaflet-control-zoom,body.sheet-open #btn-sim{display:none}}
  .fab-stack{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .fab{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#3c4043;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.28)}
  .fab svg{width:19px;height:19px;flex:none}
  .fab-round{width:42px;height:42px;border-radius:12px}
  .fab-round.active{color:#1a73e8}
  .fab-pill{height:36px;padding:0 14px;border-radius:9999px;font-size:12px;font-weight:600;color:#1967d2}
  .fab-pill svg{width:15px;height:15px}

  .pin-wrap{background:none;border:0}
  .pin{position:relative;width:32px;height:40px;cursor:pointer}
  .pin-head{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .15s}
  .pin-head svg{width:15px;height:15px}
  .pin::before{content:"";position:absolute;left:8px;top:28px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #fff}
  .pin::after{content:"";position:absolute;left:10px;top:29px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--c)}
  .pin-wrap.selected .pin-head{transform:scale(1.2);box-shadow:0 0 0 4px rgba(26,115,232,.35),0 3px 8px rgba(0,0,0,.4)}
  .pin-label{display:none;position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;color:#202124;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
  .show-labels .pin-label{display:block}

  .me-wrap{background:none;border:0}
  .me{position:relative;width:22px;height:22px}
  .me-core{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
  .me-pulse{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:rgba(26,115,232,.45);animation:me-pulse 2s ease-out infinite}
  @keyframes me-pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}

  .route-badge{background:none;border:0}
  .route-badge-inner{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#1a73e8;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9999px;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
  .route-badge-inner svg{width:14px;height:14px}

  #panel{position:fixed;z-index:1050;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.28);overflow-x:hidden;overflow-y:auto;visibility:hidden;transition:transform .3s ease,visibility 0s linear .3s}
  #panel.open{visibility:visible;transform:none;transition:transform .3s ease,visibility 0s}
  @media (min-width:768px){
    #panel{left:12px;top:116px;width:400px;max-height:calc(100vh - 128px);border-radius:16px;transform:translateX(-440px)}
    .sheet-handle{display:none}
  }
  @media (max-width:767px){
    #panel{left:0;right:0;bottom:0;max-height:62vh;border-radius:20px 20px 0 0;transform:translateY(105%)}
    .sheet-handle{display:block;position:absolute;top:7px;left:50%;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.65);transform:translateX(-50%)}
  }
  .panel-head{position:relative;color:#fff;padding:18px 16px 16px;background:var(--c)}
  .panel-head-row{display:flex;align-items:center;gap:12px;padding-right:40px}
  .panel-head .ic{flex:none;width:46px;height:46px;border-radius:9999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
  .panel-head .ic svg{width:22px;height:22px}
  .panel-title{margin:0;font-size:19px;font-weight:700;line-height:1.25}
  .panel-sub{margin:3px 0 0;font-size:13px;opacity:.92}
  .icon-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);color:#fff;border:0;cursor:pointer}
  .icon-btn svg{width:18px;height:18px}
  .panel-sec{padding:14px 16px;border-bottom:1px solid #e8eaed}
  .route-box{display:flex;gap:12px}
  .route-dots{display:flex;flex-direction:column;align-items:center;padding:12px 0}
  .dot-origin{width:12px;height:12px;border-radius:9999px;border:3px solid #1a73e8;background:#fff}
  .dot-line{flex:1;border-left:2px dotted #bdc1c6;margin:4px 0}
  .route-dots svg{width:16px;height:16px;color:#d93025}
  .route-inputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .dest-box{height:40px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#f1f3f4;font-size:14px;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .select{width:100%;height:40px;border:1px solid #dadce0;border-radius:10px;padding:0 10px;background:#fff;font-size:14px;color:#202124}
  .hint{font-size:12px;color:#5f6368;margin:8px 0 0}
  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin-top:12px;border-radius:9999px;background:#1a73e8;color:#fff;font-weight:600;font-size:14px;border:0;cursor:pointer}
  .btn-primary svg{width:17px;height:17px}
  .btn-link{color:#1a73e8;font-weight:600;font-size:13px;background:none;border:0;padding:0;cursor:pointer}
  .route-card{margin-top:12px;display:flex;align-items:center;gap:12px;border-radius:12px;background:#e8f0fe;padding:12px}
  .route-card-ic{flex:none;width:38px;height:38px;border-radius:9999px;background:#fff;color:#1a73e8;display:flex;align-items:center;justify-content:center}
  .route-card-ic svg{width:19px;height:19px}
  .route-card-main{flex:1;min-width:0}
  .route-card-time{font-size:17px;font-weight:700;color:#202124}
  .route-card-time span{font-size:13px;font-weight:400;color:#5f6368}
  .route-card-sub{font-size:11px;color:#5f6368;margin-top:2px}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;font-size:12px;font-weight:600}
  .badge svg{width:14px;height:14px;flex:none}
  .badge-blue{background:#e8f0fe;color:#1967d2}
  .badge-green{background:#e6f4ea;color:#137333}
  .badge-amber{background:#fef7e0;color:#b06000}
  .info-list{padding:6px 0}
  .info-row{display:flex;gap:14px;padding:10px 16px;align-items:flex-start;font-size:14px;line-height:1.4;color:#3c4043}
  .info-row svg{width:19px;height:19px;color:#1a73e8;flex:none;margin-top:2px}
  .banner-note{margin:4px 16px 12px;display:flex;gap:10px;border-radius:12px;background:#fef7e0;padding:12px;font-size:13px;color:#7a4100;line-height:1.4}
  .banner-note svg{width:18px;height:18px;flex:none;margin-top:1px}
  .panel-foot{padding:4px 16px 16px;font-size:11px;color:#80868b;margin:0}
  #toast{position:fixed;left:50%;top:112px;z-index:1200;max-width:min(90vw,420px);transform:translate(-50%,-16px);opacity:0;pointer-events:none;background:#202124;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .25s,transform .25s;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="map"></div>

<div id="topbar">
  <div class="search-wrap">
    <form id="search-form" role="search" autocomplete="off">
      <span id="ic-search"></span>
      <input id="search-input" type="text" placeholder="Busca edificios, comida, porterías…" aria-label="Buscar lugares">
      <button type="button" id="search-clear" hidden aria-label="Borrar búsqueda"></button>
    </form>
    <div id="results" hidden role="listbox"></div>
  </div>
  <div id="chips" role="group"></div>
</div>

<aside id="panel" aria-hidden="true"><div id="panel-body"></div></aside>
<div id="toast" role="status"></div>

<script>
window.onerror = function(msg, url, line) {
  var m = document.getElementById('map');
  if (m) m.innerHTML = '<div style="padding:120px 20px;text-align:center;color:#b91c1c;font-weight:600;">Error de carga: ' + msg + ' (línea ' + line + ')</div>';
};

function startApp() {
  const ICONS = {

    bus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6v6M15 6v6M2 12h19.6M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/></svg>',

    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>',
    access: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1M5 8l3-3 5.5 3-2.36 3.5M4.24 14.5a5 5 0 0 0 6.88 6M13.76 17.5a5 5 0 0 0-6.88-6"/></svg>',

  const svg = n => ICONS[n] || '';

  const CENTER = [4.6372, -74.0842];
  const PLAZA_CHE = { lat: 4.6362, lng: -74.0830 };
  const WALK_KMH = 5;
  const LABEL_ZOOM = 17;
  const PRICE_REST = '$15.000 - $30.000 COP';

  const CATS = {

    porteria: 'porterias entradas accesos', transmilenio: 'transmilenio estaciones bus'
  };

  const FILTERS = [

  const PLACES = [

    { id: 'edif-610', type: 'edificio', name: 'Edificio de Ciencia Política y Derecho', short: 'Ed. 610 Posgrados', code: 'Edificio 610 · Posgrados',
      lat: 4.6393, lng: -74.0843, wifi: true, access: true, hours: H_EDIF,
      desc: 'Aulas, auditorios y oficinas administrativas de posgrados en el sector norte-central del campus.',
      keywords: ['derecho', 'politica', 'auditorios', 'oficinas', 'posgrados', '610'] },
    { id: 'rolons', type: 'restaurante', name: 'Restaurante Rolons', short: 'Rolons', code: 'Sector Calle 45 · Externo',

    { id: 'la-vecina', type: 'restaurante', name: 'Restaurante La Vecina', short: 'La Vecina', code: 'Sector Calle 45 · Externo',

      keywords: ['el dorado', 'sur', 'vehicular', 'peatonal'] },
    { id: 'ent-45', type: 'porteria', name: 'Entrada Calle 45', short: 'Portería Calle 45', code: 'Portería Oriental · Calle 45',
      lat: 4.6352, lng: -74.0806, hours: H_PORT,
      desc: 'Acceso peatonal oriental, conecta directamente con la zona comercial de la Calle 45.',
      keywords: ['oriental', 'peatonal', 'restaurantes'] },
    { id: 'ent-30', type: 'porteria', name: 'Entrada Carrera 30 (NQS)', short: 'Portería Cra. 30', code: 'Portería Oriental · Av. NQS',
      lat: 4.6382, lng: -74.0802, hours: H_PORT,
      desc: 'Acceso peatonal oriental sobre la Av. NQS, frente a la estación de TransMilenio.',
      keywords: ['nqs', 'oriental', 'peatonal', 'avenida'] },
    { id: 'tm-cu', type: 'transmilenio', name: 'Estación Ciudad Universitaria', short: 'TM Ciudad Univ.', code: 'Troncal Calle 26',
      lat: 4.6327, lng: -74.0838, hours: H_TM,
      desc: 'Estación sobre el separador de la Av. El Dorado, ideal para ingresar por la portería de la Calle 26.',
      keywords: ['calle 26', 'troncal', 'el dorado'] },
    { id: 'tm-un', type: 'transmilenio', name: 'Estación Universidad Nacional', short: 'TM Univ. Nacional', code: 'Troncal NQS / Carrera 30',
      lat: 4.6378, lng: -74.0796, hours: H_TM,
      desc: 'Estación sobre el separador de la Av. NQS, ideal para ingresar por Carrera 30 o Calle 45.',
      keywords: ['nqs', 'carrera 30', 'troncal'] }
  ];

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;
  const fmtDist = m => Math.round(m) < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toLocaleString('es-CO', { minimumFractionDigits: 1, maximumFractionDigits: 1 })} km`;
  const walkMinutes = m => Math.max(1, Math.round(m / (WALK_KMH * 1000 / 60)));
  const fmtTime = min => min < 60 ? `${min} min` : `${Math.floor(min / 60)} h ${min % 60} min`;
  const subtitle = p => [p.code, CATS[p.type].label].filter(Boolean).join(' · ');

  const byId = Object.fromEntries(PLACES.map(p => [p.id, p]));
  PLACES.forEach(p => { p._hay = norm([p.name, p.code, CATS[p.type].label, GROUP_TERMS[p.type], (p.keywords || []).join(' ')].join(' ')); });
  const ORIGIN_PLACES = PLACES.filter(p => p.type === 'porteria' || p.type === 'transmilenio');

  const state = { filter: 'todos', query: '', selectedId: null, originKey: 'me', me: null, simulated: false, watchId: null, pendingRoute: false, route: null };

  const panel = $('#panel'), panelBody = $('#panel-body'), input = $('#search-input'), clearBtn = $('#search-clear'), resultsEl = $('#results'), chipsEl = $('#chips');
  $('#ic-search').innerHTML = svg('search');
  clearBtn.innerHTML = svg('x');

  const map = L.map('map', { zoomControl: false, center: CENTER, zoom: window.innerWidth >= 1000 ? 16 : 15, minZoom: 13, maxZoom: 19 });

  const primaryTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);

  let fallbackLoaded = false;
  primaryTiles.on('tileerror', () => {
    if (fallbackLoaded) return;
    fallbackLoaded = true;
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19, attribution: '&copy; Esri'
    }).addTo(map);
  });

  L.control.zoom({ position: 'bottomright', zoomInTitle: 'Acercar', zoomOutTitle: 'Alejar' }).addTo(map);

  const Fabs = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd() {
      const box = L.DomUtil.create('div', 'fab-stack');
      box.innerHTML = `<button type="button" id="btn-sim" class="fab fab-pill">${svg('pin')}<span>Simular en Plaza Che</span></button><button type="button" id="btn-locate" class="fab fab-round" aria-label="Mi ubicación">${svg('locate')}</button>`;
      L.DomEvent.disableClickPropagation(box);
      return box;
    }
  });
  map.addControl(new Fabs());

  const markersLayer = L.layerGroup().addTo(map);
  const routeLayer = L.layerGroup().addTo(map);
  const meLayer = L.layerGroup().addTo(map);

  const markers = {};
  PLACES.forEach(p => {
    const c = CATS[p.type];
    const icon = L.divIcon({
      className: 'pin-wrap',
      html: `<div class="pin" style="--c:${c.color}"><div class="pin-head">${svg(c.icon)}</div><span class="pin-label">${esc(p.short)}</span></div>`,
      iconSize: [32, 40], iconAnchor: [16, 40]
    });
    const m = L.marker([p.lat, p.lng], { icon, title: p.name, riseOnHover: true });
    m.on('click', () => selectPlace(p.id));
    markers[p.id] = m;
  });

  function matches(p) {
    const f = FILTERS.find(x => x.key === state.filter) || FILTERS[0];
    if (!f.match(p)) return false;
    const tokens = norm(state.query).split(/\s+/).filter(Boolean);
    return tokens.every(t => p._hay.includes(t));
  }

  function syncSelected() {
    PLACES.forEach(p => {
      const m = markers[p.id], el = m.getElement();
      if (el) el.classList.toggle('selected', p.id === state.selectedId);
      m.setZIndexOffset(p.id === state.selectedId ? 1000 : 0);
    });
  }

  function renderMarkers() {
    PLACES.forEach(p => {
      const show = matches(p) || p.id === state.selectedId, m = markers[p.id], has = markersLayer.hasLayer(m);
      if (show && !has) markersLayer.addLayer(m);
      if (!show && has) markersLayer.removeLayer(m);
    });
    syncSelected();
  }

  function syncLabels() { map.getContainer().classList.toggle('show-labels', map.getZoom() >= LABEL_ZOOM); }
  map.on('zoomend', syncLabels);

  function panelHeight() { return panel.classList.contains('open') ? Math.min(panel.offsetHeight, window.innerHeight * 0.62) : 0; }
  function focusOn(ll, minZoom = 17) {
    const z = Math.max(map.getZoom(), minZoom), pt = map.project(L.latLng(ll.lat, ll.lng), z);
    const target = panel.classList.contains('open') ? (isDesktop() ? pt.subtract([200, 0]) : pt.add([0, Math.max(0, panelHeight() - 112) / 2])) : pt;
    map.flyTo(map.unproject(target, z), z, { duration: 0.7 });
  }
  function fitPoints(points, maxZoom = 18) {
    if (!points.length) return;
    const desk = isDesktop(), open = panel.classList.contains('open');
    map.fitBounds(L.latLngBounds(points), { paddingTopLeft: [desk && open ? 440 : 48, 130], paddingBottomRight: [48, !desk && open ? panelHeight() + 24 : 48], maxZoom });
  }

  function renderChips() {
    chipsEl.innerHTML = FILTERS.map(f => `<button type="button" class="chip" data-filter="${f.key}" aria-pressed="${state.filter === f.key}">${svg(f.icon)}${f.label}</button>`).join('');
  }
  function renderResults() {
    const list = PLACES.filter(matches);
    resultsEl.innerHTML = list.length ? list.map(p => {
      const c = CATS[p.type];
      return `<button type="button" class="result" data-id="${p.id}" style="--c:${c.color}"><span class="ic">${svg(c.icon)}</span><span class="result-info"><span class="result-title">${esc(p.name)}</span><span class="result-sub">${esc(subtitle(p))}</span></span></button>`;
    }).join('') : `<div style="padding:16px;font-size:14px;color:#5f6368;">No encontramos lugares para «${esc(state.query)}».</div>`;
  }

  const showResults = () => { resultsEl.hidden = false; }, hideResults = () => { resultsEl.hidden = true; };
  function setFilter(key) {
    state.filter = key;
    chipsEl.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === key)));
    renderMarkers(); renderResults(); fitPoints(PLACES.filter(matches).map(p => [p.lat, p.lng]));
  }

  chipsEl.addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b) setFilter(b.dataset.filter); });
  input.addEventListener('input', () => { state.query = input.value; clearBtn.hidden = !input.value; renderMarkers(); renderResults(); showResults(); });
  input.addEventListener('focus', () => { renderResults(); showResults(); });
  $('#search-form').addEventListener('submit', e => { e.preventDefault(); const first = PLACES.filter(matches)[0]; if (first) { input.blur(); selectPlace(first.id); } });
  clearBtn.addEventListener('click', () => { input.value = ''; state.query = ''; clearBtn.hidden = true; renderMarkers(); renderResults(); input.focus(); });
  resultsEl.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) { input.blur(); selectPlace(b.dataset.id); } });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#topbar')) hideResults(); });
  map.on('click', () => { hideResults(); input.blur(); });

  function updateOffsets() {
    const sheet = !isDesktop() && panel.classList.contains('open');
    document.body.style.setProperty('--controls-offset', (sheet ? panel.offsetHeight : 0) + 'px');
    document.body.classList.toggle('sheet-open', sheet);
  }
  window.addEventListener('resize', updateOffsets);

  const meLabel = () => state.me ? (state.simulated ? 'Mi ubicación (simulada · Plaza Che)' : 'Mi ubicación') : 'Mi ubicación';
  function originSelectHTML(p) {
    const opt = pl => `<option value="${pl.id}"${state.originKey === pl.id ? ' selected' : ''}${pl.id === p.id ? ' disabled' : ''}>${esc(pl.name)}</option>`;
    return `<select id="origin-select" class="select"><option value="me"${state.originKey === 'me' ? ' selected' : ''}>${esc(meLabel())}</option><optgroup label="Porterías">${ORIGIN_PLACES.filter(x => x.type === 'porteria').map(opt).join('')}</optgroup><optgroup label="Estaciones de TransMilenio">${ORIGIN_PLACES.filter(x => x.type === 'transmilenio').map(opt).join('')}</optgroup></select>`;
  }
  const infoRow = (icon, html) => `<div class="info-row">${svg(icon)}<div>${html}</div></div>`;

  function panelHTML(p) {
    const c = CATS[p.type], badges = [];
    if (p.wifi) badges.push(`<span class="badge badge-blue">${svg('wifi')}Wi-Fi: <b>UNAL</b></span>`);
    if (p.access) badges.push(`<span class="badge badge-green">${svg('access')}Accesibilidad universal</span>`);
    if (p.price) badges.push(`<span class="badge badge-amber">${svg('money')}${esc(p.price)}</span>`);
    const rows = [infoRow('info', esc(p.desc))];
    if (p.access) rows.push(infoRow('access', 'Todos los edificios del campus cuentan con rampas y ascensores.'));
    rows.push(infoRow('clock', esc(p.hours)), infoRow('pin', `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`));

    return `<div class="panel-head" style="--c:${c.color}"><span class="sheet-handle"></span><button type="button" class="icon-btn" data-action="close">${svg('x')}</button><div class="panel-head-row"><span class="ic">${svg(c.icon)}</span><div style="min-width:0"><h2 class="panel-title">${esc(p.name)}</h2><p class="panel-sub">${esc(subtitle(p))}</p></div></div></div>
      <section class="panel-sec"><div class="route-box"><div class="route-dots"><span class="dot-origin"></span><span class="dot-line"></span>${svg('pin')}</div><div class="route-inputs"><div>${originSelectHTML(p)}</div><div class="dest-box">${esc(p.name)}</div></div></div><p id="origin-hint" class="hint" hidden></p><button type="button" class="btn-primary" data-action="route">${svg('nav')}Cómo llegar</button><div id="route-result"></div></section>
      ${badges.length ? `<section class="panel-sec"><div class="badges">${badges.join('')}</div></section>` : ''}
      <section class="info-list">${rows.join('')}</section>
      ${p.banner ? `<div class="banner-note">${svg('info')}<div>${esc(p.banner)}</div></div>` : ''}
      <p class="panel-foot">Horarios y precios de referencia; confírmalos directamente con cada lugar.</p>`;
  }

  function renderPanel(p) { panelBody.innerHTML = panelHTML(p); updateOriginHint(); showRouteResult(); }
  function openPanel() { panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false'); panel.scrollTop = 0; updateOffsets(); }
  function closePanel() { panel.classList.remove('open'); panel.setAttribute('aria-hidden', 'true'); clearRoute(); state.selectedId = null; renderMarkers(); updateOffsets(); }
  function selectPlace(id) {
    const p = byId[id]; if (!p) return;
    if (state.selectedId && state.selectedId !== id) clearRoute();
    state.selectedId = id; if (state.originKey === id) state.originKey = 'me';
    hideResults(); renderMarkers(); renderPanel(p); openPanel(); focusOn(p);
  }

  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-action]'); if (!b) return;
    if (b.dataset.action === 'close') closePanel();
    if (b.dataset.action === 'route') requestRoute();
    if (b.dataset.action === 'clear-route') clearRoute();
    if (b.dataset.action === 'simulate') simulateLocation();
  });
  panel.addEventListener('change', e => {
    if (e.target.id === 'origin-select') { state.originKey = e.target.value; updateOriginHint(); if (state.route) requestRoute(); }
  });

  function updateOriginHint() {
    const el = $('#origin-hint'); if (!el) return;
    if (state.originKey === 'me' && !state.me) { el.hidden = false; el.innerHTML = 'Se pedirá tu GPS al pulsar «Cómo llegar», o <button type="button" class="btn-link" data-action="simulate">simula estar en Plaza Che</button>.'; }
    else if (state.originKey === 'me' && state.simulated) { el.hidden = false; el.textContent = 'Usando ubicación simulada en Plaza Che.'; }
    else el.hidden = true;
  }

  function originLatLng(key) { return key === 'me' ? (state.me ? [state.me.lat, state.me.lng] : null) : (byId[key] ? [byId[key].lat, byId[key].lng] : null); }
  function requestRoute() {
    const dest = byId[state.selectedId]; if (!dest) return;
    if (state.originKey === 'me' && !state.me) { state.pendingRoute = true; toast('Buscando tu ubicación…', 2500); startLocate({ recenter: false }); return; }
    traceRoute({ fit: true });
  }
  function traceRoute({ fit = true } = {}) {
    const dest = byId[state.selectedId], o = originLatLng(state.originKey); if (!dest || !o) return;
    const d = [dest.lat, dest.lng], dist = map.distance(o, d);
    routeLayer.clearLayers();
    if (dist < 3) { state.route = null; showRouteResult(); toast('Ya estás en el destino.'); return; }
    const mins = walkMinutes(dist);
    L.polyline([o, d], { color: '#ffffff', weight: 10, opacity: 0.95, lineCap: 'round', interactive: false }).addTo(routeLayer);
    L.polyline([o, d], { color: '#1a73e8', weight: 6, opacity: 1, lineCap: 'round', interactive: false }).addTo(routeLayer);
    L.circleMarker(o, { radius: 7, color: '#1a73e8', weight: 3, fillColor: '#ffffff', fillOpacity: 1, interactive: false }).addTo(routeLayer);
    L.marker([(o[0] + d[0]) / 2, (o[1] + d[1]) / 2], {
      icon: L.divIcon({ className: 'route-badge', html: `<div class="route-badge-inner">${svg('walk')}${fmtTime(mins)} · ${fmtDist(dist)}</div>`, iconSize: [0, 0], iconAnchor: [0, 0] }),
      interactive: false, zIndexOffset: 500
    }).addTo(routeLayer);
    state.route = { dist, mins }; showRouteResult(); if (fit) fitPoints([o, d]);
  }
  function showRouteResult() {
    const el = $('#route-result'); if (!el) return;
    if (!state.route) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="route-card"><span class="route-card-ic">${svg('walk')}</span><div class="route-card-main"><div class="route-card-time">${fmtTime(state.route.mins)} <span>· ${fmtDist(state.route.dist)}</span></div><div class="route-card-sub">A pie a ${WALK_KMH} km/h · distancia aproximada</div></div><button type="button" class="btn-link" data-action="clear-route">Quitar</button></div>`;
  }
  function clearRoute() { routeLayer.clearLayers(); state.route = null; state.pendingRoute = false; showRouteResult(); }

  let meMarker = null;
  function setMe(ll) {
    state.me = { lat: ll.lat, lng: ll.lng };
    if (!meMarker) {
      meMarker = L.marker([ll.lat, ll.lng], {
        icon: L.divIcon({ className: 'me-wrap', html: '<div class="me"><span class="me-pulse"></span><span class="me-core"></span></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
        interactive: false, zIndexOffset: 2000
      }).addTo(meLayer);
    } else meMarker.setLatLng([ll.lat, ll.lng]);
    const opt = $('#origin-select option[value="me"]'); if (opt) opt.textContent = meLabel();
    updateOriginHint();
    const b = $('#btn-locate'); if (b) b.classList.toggle('active', !!state.me && !state.simulated);
    if (state.route && state.originKey === 'me') traceRoute({ fit: false });
  }
  function stopWatch() { if (state.watchId !== null && 'geolocation' in navigator) navigator.geolocation.clearWatch(state.watchId); state.watchId = null; }
  function startLocate({ recenter = true } = {}) {
    if (!('geolocation' in navigator)) { state.pendingRoute = false; toast('Tu navegador no soporta GPS. Usa «Simular en Plaza Che».'); return; }
    state.simulated = false;
    if (state.watchId !== null) { if (state.me && recenter) focusOn(state.me, 17); return; }
    let first = true;
    state.watchId = navigator.geolocation.watchPosition(pos => {
      setMe({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      if (first) { first = false; if (state.pendingRoute) { state.pendingRoute = false; traceRoute({ fit: true }); } else if (recenter) focusOn(state.me, 17); }
    }, () => { stopWatch(); state.pendingRoute = false; toast('No se obtuvo GPS. Prueba «Simular en Plaza Che».', 4500); updateOriginHint(); }, { enableHighAccuracy: true, timeout: 15000 });
  }
  function simulateLocation() {
    stopWatch(); state.simulated = true; setMe(PLAZA_CHE); toast('Ubicación simulada en Plaza Che.');
    if (state.pendingRoute) { state.pendingRoute = false; traceRoute({ fit: true }); } else focusOn(PLAZA_CHE, 18);
  }
  $('#btn-locate').addEventListener('click', () => { if (state.me && state.watchId !== null) { focusOn(state.me, 17); return; } toast('Buscando tu ubicación…', 2500); startLocate({ recenter: true }); });
  $('#btn-sim').addEventListener('click', simulateLocation);

  let toastTimer;
  function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }

  renderChips(); renderMarkers(); renderResults(); syncLabels(); updateOffsets();
}

// Carga Leaflet con respaldo automático de 3 servidores distintos
(function loadLeaflet(urls) {
  if (typeof L !== 'undefined') { startApp(); return; }
  if (!urls.length) {
    document.getElementById('map').innerHTML = '<div style="padding:120px 20px;text-align:center;color:#b91c1c;">No se pudo descargar Leaflet desde internet. Revisa tu conexión o bloqueadores de anuncios.</div>';
    return;
  }
  var s = document.createElement('script');
  s.src = urls[0];
  s.onload = function() { startApp(); };
  s.onerror = function() { loadLeaflet(urls.slice(1)); };
  document.body.appendChild(s);
})([
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'
]);
</script>
</body>
</html>
