<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa Campus UNAL · Sede Bogotá</title>
<meta name="description" content="Mapa interactivo del campus de la Universidad Nacional de Colombia, Sede Bogotá: edificios, comida, porterías y estaciones de TransMilenio.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<style>
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;padding:0}
  body{
    font-family:Roboto,"Google Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    overflow:hidden;background:#e5e3df;color:#202124;
    -webkit-tap-highlight-color:transparent;
    --controls-offset:0px;
  }
  #map{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;z-index:0;background:#e5e3df}

  /* ── Barra superior y buscador ── */
  #topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1100;pointer-events:none}
  @media (min-width:768px){#topbar{right:auto;width:400px}}
  .search-wrap{position:relative;pointer-events:auto;z-index:20}
  #search-form{display:flex;align-items:center;height:48px;background:#fff;border-radius:9999px;box-shadow:0 2px 10px rgba(0,0,0,.22);padding:0 16px;gap:12px}
  #search-form svg{width:20px;height:20px;color:#5f6368;flex:none}
  #search-input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;color:#202124}
  #search-input::placeholder{color:#80868b}
  #search-clear{flex:none;width:32px;height:32px;margin-right:-6px;border:0;border-radius:9999px;background:transparent;color:#5f6368;display:flex;align-items:center;justify-content:center;cursor:pointer}
  #search-clear:hover{background:#f1f3f4}
  #results{position:absolute;left:0;right:0;top:56px;background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.22);overflow-y:auto;max-height:60vh;padding:6px 0}
  .result{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;background:transparent;border:0;cursor:pointer}
  .result:hover,.result:focus-visible{background:#f1f3f4;outline:none}
  .result .ic{flex:none;width:36px;height:36px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
  .result .ic svg{width:18px;height:18px}
  .result-info{min-width:0;flex:1}
  .result-title{display:block;font-size:14px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result-sub{display:block;font-size:12px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── Chips de filtro ── */
  #chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-top:8px;scrollbar-width:none;pointer-events:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{pointer-events:auto;flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:9999px;background:#fff;color:#3c4043;font-size:13px;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.25);border:1px solid transparent;cursor:pointer;transition:background .15s}
  .chip svg{width:15px;height:15px}
  .chip:hover{background:#f1f3f4}
  .chip[aria-pressed="true"]{background:#e8f0fe;color:#1967d2;border-color:#d2e3fc}

  /* ── Controles flotantes ── */
  .leaflet-bottom.leaflet-right{bottom:var(--controls-offset);transition:bottom .3s ease}
  .leaflet-touch .leaflet-bar{border:0;box-shadow:0 2px 8px rgba(0,0,0,.28);border-radius:12px;overflow:hidden}
  .leaflet-touch .leaflet-bar a{width:42px;height:42px;line-height:42px;font-size:20px;color:#3c4043}
  .leaflet-control-attribution{font-size:10px}
  @media (max-width:767px){body.sheet-open .leaflet-control-zoom,body.sheet-open #btn-sim{display:none}}
  .fab-stack{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .fab{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:#3c4043;border:0;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.28);transition:background .15s,color .15s}
  .fab:hover{background:#f1f3f4}
  .fab svg{width:19px;height:19px;flex:none}
  .fab-round{width:42px;height:42px;border-radius:12px}
  .fab-round.active{color:#1a73e8}
  .fab-pill{height:36px;padding:0 14px;border-radius:9999px;font-size:12px;font-weight:600;color:#1967d2}
  .fab-pill svg{width:15px;height:15px}

  /* ── Marcadores ── */
  .pin-wrap{background:none;border:0}
  .pin{position:relative;width:32px;height:40px;cursor:pointer}
  .pin-head{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .15s,box-shadow .15s}
  .pin-head svg{width:15px;height:15px}
  .pin::before{content:"";position:absolute;left:8px;top:28px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:11px solid #fff}
  .pin::after{content:"";position:absolute;left:10px;top:29px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--c)}
  .pin:hover .pin-head{transform:scale(1.1)}
  .pin-wrap.selected .pin-head{transform:scale(1.2);box-shadow:0 0 0 4px rgba(26,115,232,.35),0 3px 8px rgba(0,0,0,.4)}
  .pin-label{display:none;position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:700;color:#202124;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
  .show-labels .pin-label{display:block}

  /* ── Punto azul de ubicación ── */
  .me-wrap{background:none;border:0}
  .me{position:relative;width:22px;height:22px}
  .me-core{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
  .me-pulse{position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:rgba(26,115,232,.45);animation:me-pulse 2s ease-out infinite}
  @keyframes me-pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}

  /* ── Etiqueta de ruta ── */
  .route-badge{background:none;border:0}
  .route-badge-inner{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#1a73e8;color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9999px;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff}
  .route-badge-inner svg{width:14px;height:14px}

  /* ── Panel lateral / Bottom Sheet ── */
  #panel{position:fixed;z-index:1050;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.28);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
  #panel.open{visibility:visible;transform:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
  @media (min-width:768px){
    #panel{left:12px;top:116px;width:400px;max-height:calc(100vh - 128px);max-height:calc(100dvh - 128px);border-radius:16px;transform:translateX(-440px)}
    .sheet-handle{display:none}
  }
  @media (max-width:767px){
    #panel{left:0;right:0;bottom:0;max-height:62vh;max-height:62dvh;border-radius:20px 20px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom)}
    .sheet-handle{display:block;position:absolute;top:7px;left:50%;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.65);transform:translateX(-50%)}
  }
  .panel-head{position:relative;color:#fff;padding:18px 16px 16px;background:var(--c)}
  .panel-head-row{display:flex;align-items:center;gap:12px;padding-right:40px}
  .panel-head .ic{flex:none;width:46px;height:46px;border-radius:9999px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
  .panel-head .ic svg{width:22px;height:22px}
  .panel-title{margin:0;font-size:19px;font-weight:700;line-height:1.25}
  .panel-sub{margin:3px 0 0;font-size:13px;opacity:.92}
  .icon-btn{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);color:#fff;border:0;cursor:pointer}
  .icon-btn:hover{background:rgba(255,255,255,.35)}
  .icon-btn svg{width:18px;height:18px}

  .panel-sec{padding:14px 16px;border-bottom:1px solid #e8eaed}
  .route-box{display:flex;gap:12px}
  .route-dots{display:flex;flex-direction:column;align-items:center;padding:12px 0}
  .dot-origin{width:12px;height:12px;border-radius:9999px;border:3px solid #1a73e8;background:#fff}
  .dot-line{flex:1;border-left:2px dotted #bdc1c6;margin:4px 0}
  .route-dots svg{width:16px;height:16px;color:#d93025}
  .route-inputs{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .dest-box{height:40px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:#f1f3f4;font-size:14px;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .select{width:100%;height:40px;border:1px solid #dadce0;border-radius:10px;padding:0 10px;background:#fff;font-size:14px;color:#202124}
  .select:focus{outline:2px solid #1a73e8;outline-offset:-1px}
  .hint{font-size:12px;color:#5f6368;margin:8px 0 0}

  .btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin-top:12px;border-radius:9999px;background:#1a73e8;color:#fff;font-weight:600;font-size:14px;border:0;cursor:pointer;box-shadow:0 1px 3px rgba(26,115,232,.4);transition:background .15s}
  .btn-primary:hover{background:#1765cc}
  .btn-primary svg{width:17px;height:17px}
  .btn-link{color:#1a73e8;font-weight:600;font-size:13px;background:none;border:0;padding:0;cursor:pointer}
  .btn-link:hover{text-decoration:underline}

  .route-card{margin-top:12px;display:flex;align-items:center;gap:12px;border-radius:12px;background:#e8f0fe;padding:12px}
  .route-card-ic{flex:none;width:38px;height:38px;border-radius:9999px;background:#fff;color:#1a73e8;display:flex;align-items:center;justify-content:center}
  .route-card-ic svg{width:19px;height:19px}
  .route-card-main{flex:1;min-width:0}
  .route-card-time{font-size:17px;font-weight:700;color:#202124}
  .route-card-time span{font-size:13px;font-weight:400;color:#5f6368}
  .route-card-sub{font-size:11px;color:#5f6368;margin-top:2px}

  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9999px;font-size:12px;font-weight:600}
  .badge svg{width:14px;height:14px;flex:none}
  .badge-blue{background:#e8f0fe;color:#1967d2}
  .badge-green{background:#e6f4ea;color:#137333}
  .badge-amber{background:#fef7e0;color:#b06000}

  .info-list{padding:6px 0}
  .info-row{display:flex;gap:14px;padding:10px 16px;align-items:flex-start;font-size:14px;line-height:1.4;color:#3c4043}
  .info-row svg{width:19px;height:19px;color:#1a73e8;flex:none;margin-top:2px}
  .banner-note{margin:4px 16px 12px;display:flex;gap:10px;border-radius:12px;background:#fef7e0;padding:12px;font-size:13px;color:#7a4100;line-height:1.4}
  .banner-note svg{width:18px;height:18px;flex:none;margin-top:1px}
  .panel-foot{padding:4px 16px 16px;font-size:11px;color:#80868b;margin:0}

  #toast{position:fixed;left:50%;top:112px;z-index:1200;max-width:min(90vw,420px);transform:translate(-50%,-16px);opacity:0;pointer-events:none;background:#202124;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .25s,transform .25s;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="map" role="application" aria-label="Mapa del campus de la Universidad Nacional de Colombia, Sede Bogotá"></div>

<div id="topbar">
  <div class="search-wrap">
    <form id="search-form" role="search" autocomplete="off">
      <span id="ic-search"></span>
      <input id="search-input" type="text" placeholder="Busca edificios, comida, porterías…" aria-label="Buscar lugares" autocomplete="off">
      <button type="button" id="search-clear" hidden aria-label="Borrar búsqueda"></button>
    </form>
    <div id="results" hidden role="listbox" aria-label="Resultados"></div>
  </div>
  <div id="chips" role="group" aria-label="Filtros rápidos"></div>
</div>

<aside id="panel" aria-hidden="true" aria-label="Detalles del lugar"><div id="panel-body"></div></aside>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<script>
(() => {
  'use strict';

  /* ═════════════ Iconos SVG integrados (cero dependencias externas) ═════════════ */
  const ICONS = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    building: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2
